<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Cross-hatch fabric reinforcement weave pattern -->
    <pattern id="gridWeave" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 0 M 0 4 L 16 4 M 0 8 L 16 8 M 0 12 L 16 12" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
      <path d="M 0 0 L 0 16 M 4 0 L 4 16 M 8 0 L 8 16 M 12 0 L 12 16" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
      <path d="M 0 2 L 16 2 M 0 6 L 16 6 M 0 10 L 16 10 M 0 14 L 16 14" stroke="rgba(0,0,0,0.06)" stroke-width="0.8" />
      <path d="M 2 0 L 2 16 M 6 0 L 6 16 M 10 0 L 10 16 M 14 0 L 14 16" stroke="rgba(0,0,0,0.06)" stroke-width="0.8" />
    </pattern>

    <!-- Colored stripe gradient with 3D depth and subtle luster -->
    <linearGradient id="coloredStripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15" />
      <stop offset="12%" stop-color="#fff" stop-opacity="0.08" />
      <stop offset="38%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#fff" stop-opacity="0.22" />
      <stop offset="62%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="88%" stop-color="#fff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.15" />
    </linearGradient>

    <!-- White stripe gradient for glossy vinyl look -->
    <linearGradient id="whiteStripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0deda" />
      <stop offset="8%" stop-color="#f5f4f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="92%" stop-color="#f5f4f0" />
      <stop offset="100%" stop-color="#e0deda" />
    </linearGradient>

    <!-- Overall glossy vinyl vertical specular highlight -->
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

